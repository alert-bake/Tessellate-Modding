[site]
title = "Tessellate Modding"
description = "Documentation for modding Tessellate."
source = "docs"
output = "site"

[build]
# Incremental builds are enabled by default.
incremental = true

[theme]
# Visitors can switch modes with the built-in SVG sun/moon toggle.
# Their selection is saved in browser local storage.
default_mode = "dark" # "dark" or "light"

# Dark mode palette.
[theme.dark]
background = "#101114"
surface = "#191B20"
surface_secondary = "#22252B"
text = "#E6E8ED"
text_muted = "#A0A5B0"
primary = "#8B9CF6"
link = "#9AAEFF"
link_hover = "#C0CBFF"
border = "#30343D"
code_background = "#1C1F26"

# Light mode palette. This is independently configurable.
[theme.light]
background = "#FFFFFF"
surface = "#F5F6F8"
surface_secondary = "#EBEDF0"
text = "#20232A"
text_muted = "#686D78"
primary = "#586BD6"
link = "#4058C9"
link_hover = "#263FAF"
border = "#D9DCE3"
code_background = "#F0F1F4"
