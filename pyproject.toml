[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tingledoculate"
version = "0.1.0"
description = "A small, incremental static documentation generator."
readme = "TingleDoculate/README.md"
requires-python = ">=3.11"
dependencies = ["markdown-it-py>=3.0,<5"]

[project.scripts]
tingledoculate = "tingledoculate.cli:main"

[tool.setuptools]
package-dir = {"" = "TingleDoculate/src"}

[tool.setuptools.packages.find]
where = ["TingleDoculate/src"]
